name: CI — RAG

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    name: Validar nombre de rama
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verificar prefijo (feature/*, hotfix/*, chore/*)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/*|hotfix/*|chore/*) echo "OK: $BRANCH"; exit 0 ;;
            *) echo "Rama '$BRANCH' no cumple convención (feature/*, hotfix/*, chore/*)"; exit 1 ;;
          esac

  quality:
    name: Quality gate (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ruff + black
        run: pip install -q ruff black
      - name: ruff check
        run: ruff check .
      - name: black --check
        run: black --check .

  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: quality
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/RAG
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/RAG
          docker compose up -d --build centinela-rag

      - name: Health check
        run: |
          sleep 15
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8181/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/RAG && git reset --hard HEAD~1
            docker compose up -d --build centinela-rag
            exit 1
          fi
